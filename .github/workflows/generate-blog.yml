name: Generate Autonomous Content

on:
  schedule:
    - cron: "0 0 * * *" # Run daily at midnight UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  generate-blogs:
    name: Generate Blog (${{ matrix.genre }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        genre: ["coding", "ai-ml", "cybersecurity", "emerging-tech", "tech-news"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Database Core
        run: npm run build --workspace=@techinsights/database

      - name: Run Autonomous Blog Generator
        run: npm run generate:blog --workspace=@techinsights/ai-worker -- --genre=${{ matrix.genre }}
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          CLIENT_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

  generate-intel:
    name: Generate Daily Tech Intel
    needs: generate-blogs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Database Core
        run: npm run build --workspace=@techinsights/database

      - name: Run Daily Intel Generator
        run: npm run generate:intel --workspace=@techinsights/ai-worker -- --force
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
